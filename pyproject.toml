[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-flood"
version = "0.1.0"
description = "AEGIS - Agentic Evidential Geographic Intelligence for Sustainability"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "AEGIS Research Team" }
]
dependencies = [
    "duckdb>=1.1.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "geopandas>=0.14.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
